# Searches X for Star Wars artwork by artists and graphic designers (Anakin /
# the fall / Darth Vader), photos only, with politics, memes, toys, cosplay and
# AI images filtered out, ranked by views. It does NOT change the site: the
# results show on the run's summary page so you can pick which to display.
# Uses the X_BEARER_TOKEN repository secret. Each post read is a paid X read.
name: Find Star Wars edits on X

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "posts = your shares + those artists + similar artists, likes = same but from YOUR likes (needs 4 account-key secrets), all = search all-time art, recent = last 7 days"
        type: choice
        options: [posts, likes, all, recent]
        default: posts
      username:
        description: "X account whose posts/reposts to use (posts mode)"
        type: string
        default: rebel_520
      pages:
        description: "Pages of 100 of your posts to read (about $0.50 per page)"
        type: number
        default: 5
      artist_pages:
        description: "Pages of 100 posts from those artists + their reposts (about $0.50 per page)"
        type: number
        default: 5
      similar_pages:
        description: "Pages of 100 posts from NEW artists using the same hashtags (about $0.50 per page)"
        type: number
        default: 5

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Search X
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # your own account's keys: only needed for "likes" mode
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_MODE: ${{ inputs.mode }}
          X_USERNAME: ${{ inputs.username }}
          X_PAGES: ${{ inputs.pages }}
          X_ARTIST_PAGES: ${{ inputs.artist_pages }}
          X_SIMILAR_PAGES: ${{ inputs.similar_pages }}
        run: node scripts/x-find.mjs

      - name: Save the full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-candidates
          path: x-candidates.json
          if-no-files-found: ignore
