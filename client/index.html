<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rwd-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rebel Web Designs | Build a website that will last forever</title>
    <meta
      name="description"
      content="Rebel Web Designs — Full-Stack Web Developer, UX/UI Specialist, and Graphic Designer. Websites, logos, flyers, photo retouching, and video for small businesses and individuals. Built to last forever."
    />
    <link rel="canonical" href="https://rebelwebdesigns.com/" />

    <meta name="author" content="Rebel Web Designs" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta
      name="keywords"
      content="web designer Arizona, web developer, UX UI Figma, logo design, flyers, graphic design, photo editing, Shopify, Wix, GoDaddy, custom website, Rebel Web Designs"
    />

    <!-- Open Graph / Facebook / LinkedIn / iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rebel Web Designs" />
    <meta property="og:url" content="https://rebelwebdesigns.com/" />
    <meta property="og:title" content="Rebel Web Designs — Fuel your fire" />
    <meta
      property="og:description"
      content="Full-Stack Web Developer, UX/UI Specialist, and Graphic Designer. Websites, logos, flyers, photo editing, Shopify & custom builds — tailored to your audience."
    />
    <meta property="og:image" content="https://rebelwebdesigns.com/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rebel Web Designs — Fuel your fire" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rebel Web Designs — Fuel your fire" />
    <meta
      name="twitter:description"
      content="Web development, UX/UI, logos, flyers, graphic design, Shopify & custom builds — tailored to your audience."
    />
    <meta name="twitter:image" content="https://rebelwebdesigns.com/og-image.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: helps Google understand the business for search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Rebel Web Designs",
        "url": "https://rebelwebdesigns.com/",
        "image": "https://rebelwebdesigns.com/og-image.svg",
        "description": "Full-stack web development, UX/UI design (Figma), logos, flyers, graphic design, photo editing, and custom websites tailored to your audience.",
        "slogan": "Fuel your fire with Rebel Web Designs",
        "areaServed": { "@type": "State", "name": "Arizona" },
        "address": { "@type": "PostalAddress", "addressRegion": "AZ", "addressCountry": "US" },
        "priceRange": "$$",
        "knowsAbout": [
          "Web Development", "UX/UI Design", "Logo Design", "Graphic Design",
          "Flyers", "Photo Editing", "Shopify", "Wix", "GoDaddy", "React", "Figma"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
