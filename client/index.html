<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- tab icon: "RWD" in white with a black outline, drawn on a 16px grid so it's
         sharp in a browser tab. ico for older browsers, png for iPhone home
         screens. (Change the file name / ?v= when the icon changes, or
         browsers keep showing the old one.) -->
    <link rel="icon" href="/favicon.ico?v=5" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/rwd-favicon-5.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rebel Web Designs | Build a website that will last forever</title>
    <meta
      name="description"
      content="Fuel your Fire with Rebel Web Designs. Full-Stack Web Developer, UX/UI Specialist, and Graphic Designer in Arizona. Websites, logos, flyers, photo retouching, and video for small businesses and individuals. Built to last forever."
    />
    <link rel="canonical" href="https://rebelwebdesigns.com/" />

    <meta name="author" content="Rebel Web Designs" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta
      name="keywords"
      content="web designer Arizona, web developer, UX UI Figma, logo design, flyers, graphic design, photo editing, Shopify, Wix, GoDaddy, custom website, Rebel Web Designs"
    />

    <!-- Open Graph / Facebook / LinkedIn / iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rebel Web Designs" />
    <meta property="og:url" content="https://rebelwebdesigns.com/" />
    <meta property="og:title" content="Fuel your Fire with Rebel Web Designs" />
    <meta
      property="og:description"
      content="Full-Stack Web Developer, UX/UI Specialist, and Graphic Designer. Websites, logos, flyers, photo editing, Shopify, and custom builds tailored to your audience."
    />
    <meta property="og:image" content="https://rebelwebdesigns.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fuel your Fire with Rebel Web Designs" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fuel your Fire with Rebel Web Designs" />
    <meta
      name="twitter:description"
      content="Web development, UX/UI, logos, flyers, graphic design, Shopify, and custom builds tailored to your audience."
    />
    <meta name="twitter:image" content="https://rebelwebdesigns.com/og-image.png" />
    <meta name="twitter:image:alt" content="Fuel your Fire with Rebel Web Designs" />

    <!-- the Star Wars card photos come from X's image server: connect early -->
    <link rel="preconnect" href="https://pbs.twimg.com" />

    <!-- Structured data: tells Google this site IS "Rebel Web Designs" so the
         brand ranks for its own name, with the right site name + logo shown. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://rebelwebdesigns.com/#website",
            "name": "Rebel Web Designs",
            "alternateName": "RWD",
            "url": "https://rebelwebdesigns.com/",
            "publisher": { "@id": "https://rebelwebdesigns.com/#business" }
          },
          {
            "@type": "ProfessionalService",
            "@id": "https://rebelwebdesigns.com/#business",
            "name": "Rebel Web Designs",
            "url": "https://rebelwebdesigns.com/",
            "logo": "https://rebelwebdesigns.com/rwd-logo.svg",
            "image": "https://rebelwebdesigns.com/og-image.png",
            "description": "Full-stack web development, UX/UI design (Figma), logos, flyers, graphic design, photo editing, and custom websites tailored to your audience.",
            "slogan": "Fuel your Fire with Rebel Web Designs",
            "areaServed": { "@type": "State", "name": "Arizona" },
            "address": { "@type": "PostalAddress", "addressRegion": "AZ", "addressCountry": "US" },
            "priceRange": "$$",
            "knowsAbout": [
              "Web Development", "UX/UI Design", "Logo Design", "Graphic Design",
              "Flyers", "Photo Editing", "Shopify", "Wix", "GoDaddy", "React", "Figma"
            ],
            "sameAs": [
              "https://www.linkedin.com/in/rey-olvera/",
              "https://reyolvera.com"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
