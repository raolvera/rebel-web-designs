<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Rebel Web Designs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c9ccd1"/>
      <stop offset="1" stop-color="#8a8d93"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#e11d2a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e11d2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#c9ccd1" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- RWD globe mark -->
  <g transform="translate(600,175)">
    <circle cx="0" cy="0" r="78" fill="#0a0a0b"/>
    <g fill="none" stroke="#c9ccd1" stroke-width="3.5" stroke-linecap="round">
      <circle cx="0" cy="0" r="70"/>
      <ellipse cx="0" cy="0" rx="30" ry="70"/>
      <line x1="-70" y1="0" x2="70" y2="0"/>
      <path d="M-58 -34 C -20 -12, 20 -12, 58 -34"/>
      <path d="M-58 34 C -20 12, 20 12, 58 34"/>
    </g>
    <text x="0" y="2" text-anchor="middle" dominant-baseline="central"
      font-family="'Space Grotesk', Arial, sans-serif" font-size="48" font-weight="700"
      fill="url(#silver)" style="paint-order:stroke;stroke:#0a0a0b;stroke-width:6px">RWD</text>
  </g>

  <!-- Wordmark -->
  <text x="600" y="330" text-anchor="middle"
    font-family="'Space Grotesk', Arial, sans-serif" font-size="30" font-weight="600"
    letter-spacing="6" fill="#8a8d93">FUEL YOUR FIRE WITH</text>
  <text x="600" y="410" text-anchor="middle"
    font-family="'Space Grotesk', Arial, sans-serif" font-size="78" font-weight="700"
    letter-spacing="6" fill="url(#silver)">REBEL WEB DESIGNS</text>
  <rect x="490" y="430" width="220" height="5" rx="2.5" fill="#e11d2a"/>

  <!-- Subline -->
  <text x="600" y="505" text-anchor="middle"
    font-family="Arial, sans-serif" font-size="26" fill="#c9ccd1">
    Web Development · UX/UI · Logos · Flyers · Graphic Design
  </text>
  <text x="600" y="548" text-anchor="middle"
    font-family="Arial, sans-serif" font-size="20" fill="#8a8d93">
    rebelwebdesigns.com
  </text>
</svg>
