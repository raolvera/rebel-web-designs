<?xml version="1.0" encoding="UTF-8"?>
<!-- Browser tab icon: a bold R over the www globe, on a black circle.
     Drawn on a 16-pixel grid: every straight edge sits on a whole pixel at
     16px (and at 32px / 48px), so the tab icon stays sharp instead of soft.
     favicon.ico and apple-touch-icon.png are made from this file. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64">
  <!-- black circle -->
  <circle cx="8" cy="8" r="8" fill="#0a0a0b"/>

  <!-- www globe behind the R: outline, center meridian, equator -->
  <g fill="none" stroke="#7a7d83" stroke-width="1">
    <circle cx="8" cy="8" r="6.5"/>
    <ellipse cx="8" cy="8" rx="2.5" ry="6.5"/>
    <line x1="1.5" y1="7.5" x2="14.5" y2="7.5"/>
  </g>

  <!-- R: solid silver-white, 3px stem, 2px bars -->
  <path fill="#f1f2f4" fill-rule="evenodd"
        d="M4 3H10L12 5V7L10 9L12 13H9L7 9V13H4Z M7 5H9L10 6L9 7H7Z"/>
</svg>
