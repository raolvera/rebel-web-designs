<?xml version="1.0" encoding="UTF-8"?>
<!-- Browser tab icon: a bold R over the www globe, on a black circle.
     Drawn with shapes (no font) and only a few thick globe lines, so it stays
     sharp at 16px. favicon.ico and apple-touch-icon.png are made from this. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d4d7dc"/>
      <stop offset="1" stop-color="#9a9da3"/>
    </linearGradient>
  </defs>

  <!-- black circle -->
  <circle cx="32" cy="32" r="32" fill="#0a0a0b"/>

  <!-- www globe behind the R -->
  <g fill="none" stroke="#8a8d93" stroke-width="2.6">
    <circle cx="32" cy="32" r="27"/>
    <ellipse cx="32" cy="32" rx="11.5" ry="27"/>
    <line x1="5" y1="32" x2="59" y2="32"/>
  </g>

  <!-- R: silver with a black outline so it stands clear of the globe lines -->
  <path transform="translate(-1.25 0)" fill="url(#silver)" fill-rule="evenodd"
        stroke="#0a0a0b" stroke-width="3" stroke-linejoin="round" paint-order="stroke"
        d="M20 14H35.5C41.6 14 45.5 17.8 45.5 23.5C45.5 27.6 43.4 30.7 40 32.1L46.5 50H37L31.4 33.4H29V50H20Z
           M29 21V27.4H34.6C36.4 27.4 37.2 26.2 37.2 24.2C37.2 22.2 36.4 21 34.6 21Z"/>
</svg>
