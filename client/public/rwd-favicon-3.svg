<?xml version="1.0" encoding="UTF-8"?>
<!-- Browser tab icon: a white R with a black outline, no background.
     Drawn on a 16-pixel grid: every straight edge (and the 1px outline around
     it) lands on a whole pixel at 16px / 32px / 48px, so it stays sharp in a
     browser tab, on light and dark tabs alike. favicon.ico and
     apple-touch-icon.png are made from this file. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64">
  <path fill="#ffffff" fill-rule="evenodd"
        stroke="#0a0a0b" stroke-width="2" stroke-linejoin="miter" paint-order="stroke"
        d="M3 2H10L13 5V8L11 10L13 14H10L8 10H7V14H3Z M7 5H9L10 6V7L9 8H7Z"/>
</svg>
